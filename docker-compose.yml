version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: revenueleak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenueleak_os
    ports:
      - "5432:5432"
    volumes:
      - revenueleak_pgdata:/var/lib/postgresql/data

volumes:
  revenueleak_pgdata:
